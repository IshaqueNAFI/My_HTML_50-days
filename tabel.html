<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabel</title>

    <style>
        table{
            border-collapse: collapse;
        } 
        td{
            border:1px solid black;
            padding:4px 5px

        }
        th , caption{
            border:1px solid black;
            padding:3px 3px;
        }
    </style>
</head>
<ul>
    <li>table:table</li>
    <li>table body: tbody</li>
    <li>table head :thead</li>
    <li>table foooter: tfoot</li>
    <li>table row: tr</li>
    <li>table data : td</li>
    <li>table head: th</li>
</ul>


<body>
    <h2> Html tabel</h2>
    <table>
        <caption>employee details</caption>

        <thead>

            <th>no.</th>
            <th>name</th>
            <th>salary</th>
            <th>salary per month</th>
            
          

        </thead>

        <tbody>
              <tr>
                <td>1</td>
                <td> bill gates</td>
                <td>8999</td>
                <td>9999</td>
                
            </tr>

            <tr>
                <td> 2</td>
                <td>steve jobs</td>
                <td>400</td>
                <td>444</td>



            </tr>

            <tr>
                <td>3</td>
                <td>mark</td>
                <td>888</td>
                <td>777</td>
            </tr>
            

        </tbody>

        <tfoot>

            <tr >
                <td colspan="2">total employee of the month</td>
            </tr>

        </tfoot>

    </table>
     
    
</body>
</html>
